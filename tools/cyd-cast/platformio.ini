; ESP32 "Cheap Yellow Display" (ESP32-2432S028R) that keeps the plane map cast on the Nest Hub.
; Build: pio run        Flash: pio run -t upload        Serial log: pio device monitor
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  bblanchon/ArduinoJson@7.2.1
  tzapu/WiFiManager@2.0.17
build_flags =
  ; TFT_eSPI setup for the CYD's ILI9341 screen (no User_Setup.h editing needed)
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
