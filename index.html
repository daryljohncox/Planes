<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planes Nearby</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0d1117">
<!--
  Live aircraft map for a Google Nest Hub (2nd gen, 1024x600).
  Data: adsb.lol (aircraft), Planespotters.net (actual photos), Wikipedia (generic type photos),
  OurAirports (airports.json, public domain – rebuild with tools/build-airports.py),
  map tiles © OpenStreetMap contributors © CARTO.

  Side panel lists every plane in the search area; tap one (here or on the map) for its photo and data.

  Optional URL settings (add after the link, e.g. ?r=40&zoom=9):
    lat, lon   centre point             (default Marton: -40.07, 175.38)
    r          radius in nautical miles (default 60, max 250)
    zoom       fixed map zoom, e.g. 9   (default: 25 km to the map edge)
    edge       km from home to the map edge in the home view (default 25; Sanson is about 17)
    name       place name in header     (default Marton)
    tz         clock time zone          (default Pacific/Auckland)
    map        natgeo (default atlas style), topo (OpenTopoMap), dark (original dark map)
    announce   km from the map centre at which planes are announced (default 25)
    voice      0 = start with spoken announcements off (also switchable with the Voice button)

  Voice: announcements are spoken by api/tts.js (Microsoft's free neural voices, British "Sonia" by default,
  chosen in the Voice panel; Google's as backup),
  with the device's own voice as a last resort. Settings, rare plane list and hourly counts are kept in
  localStorage on the device. Space station: orbit from api/iss.js + satellite.js.
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- satellite.js: space station position and passes (optional; loads in the background) -->
<script async src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<style>
:root{--bg:#0b1016;--panel:#141b24;--deep:#0e141c;--txt:#e8eef5;--dim:#8b9aab;--acc:#ff9a1f;--plane:#ffd84a;--good:#4cd37a;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
body{display:flex;flex-direction:column;padding:1.2vh 1.2vw;gap:1.2vh}

header{display:flex;align-items:center;gap:1.6vw;height:6vh;font-size:3.1vh;flex:0 0 auto}
header .t{font-weight:700}
header .c{color:var(--dim)}
header .sp{flex:1}
#status{font-size:2.3vh;color:var(--dim)}
#status.err{color:var(--bad)}
#clock{font-weight:700;font-variant-numeric:tabular-nums}

main{flex:1;display:flex;gap:1.2vw;min-height:0}
#mapwrap{flex:1;position:relative;display:flex;min-width:0}
#map{flex:1;border-radius:1.6vh;overflow:hidden;background:#0d1117;touch-action:none}
#mapbtns{position:absolute;top:1.4vh;left:1.4vh;z-index:1000;display:flex;gap:1.2vh}
#keybtn{display:flex;height:7vh;min-height:44px;padding:0 2vh;gap:1vh;align-items:center;font:700 2.8vh system-ui,sans-serif;
  line-height:1;white-space:nowrap;color:#fff;background:#13284a;border:0;border-radius:1.2vh;cursor:pointer;
  box-shadow:0 0 0 2px rgba(255,255,255,.5),0 .6vh 1.6vh rgba(0,0,0,.6)}
#keybtn:active{background:#24406b}
#stepbtns{position:absolute;left:1.4vh;bottom:7vh;z-index:1000;display:flex;gap:1.2vh}
#hourbtn{position:absolute;right:1.4vh;bottom:7vh;z-index:1000}
#stepbtns .mbtn{width:max(7vh,44px);justify-content:center;padding:0;font-size:4.4vh;line-height:1}
#zoombtns{position:absolute;top:calc(2.6vh + max(7vh,44px));left:1.4vh;z-index:1000;display:flex;flex-direction:column;gap:1.2vh;align-items:flex-start}
#keybtn .dots{display:flex;gap:.4vh}
#sirenbtn{display:flex;height:7vh;min-height:44px;padding:0;border:0;border-radius:1.4vh;overflow:hidden;background:#000;
  box-shadow:0 .4vh 1.4vh rgba(0,0,0,.45);animation:sirenglow .65s steps(1) infinite}
#sirenbtn[hidden]{display:none}
#sirenbtn img{height:100%;width:auto;display:block}
#sirenbtn b{display:flex;align-items:center;padding:0 1.6vh;background:#0b1f3a;color:#fff;font:800 3.2vh system-ui,sans-serif}
#sirenbtn b:empty{display:none}
#sirenbtn.idle{animation:none;opacity:.8}
@keyframes sirenglow{0%{box-shadow:0 0 1.6vh #2a6bff}50%{box-shadow:0 0 1.6vh #ff2a2a}}
#keybtn .dots i{width:1.4vh;height:1.4vh;border-radius:50%;background:#ffd400}
#keybtn .dots i:nth-child(2){background:#1fa24a}
#keybtn .dots i:nth-child(3){background:#d7191c}
#key{position:absolute;top:10vh;left:1.4vh;bottom:1.4vh;z-index:1001;width:min(46vw,440px);display:flex;flex-direction:column;
  background:var(--panel);color:var(--txt);border-radius:1.4vh;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 1vh 3vh rgba(0,0,0,.7);overflow:hidden}
#key[hidden]{display:none}
#key .kh{display:flex;align-items:center;justify-content:space-between;padding:1.2vh 1.8vh;font-weight:700;font-size:2.6vh;border-bottom:1px solid #1d2632}
#key .kh button{border:0;background:#1d2632;color:#fff;font-size:2.6vh;width:5.6vh;height:5.6vh;border-radius:1vh;cursor:pointer}
#keyrows{overflow-y:auto;padding:.6vh 0}
.krow{display:flex;align-items:center;gap:1.6vh;padding:.7vh 1.8vh}
.krow .kic{flex:0 0 auto;width:5vh;height:5vh;border-radius:1vh;background:#dfe6ea;display:flex;align-items:center;justify-content:center}
.krow .kic svg{width:3.8vh;height:3.8vh}
.krow.emg svg{animation:emg 1s steps(1) infinite}
.krow b{display:block;font-size:2.3vh}
.krow small{display:block;font-size:1.8vh;color:var(--dim)}
#home{display:none;height:7vh;min-height:44px;padding:0 2vh;gap:1vh;
  align-items:center;justify-content:center;font:700 2.8vh system-ui,sans-serif;line-height:1;white-space:nowrap;
  color:#000;background:var(--acc);border:0;border-radius:1.2vh;cursor:pointer;
  box-shadow:0 0 0 2px rgba(0,0,0,.45),0 .6vh 1.6vh rgba(0,0,0,.6)}
#home:active{background:#ffb14f}
#home .ic{font-size:3.6vh}
.leaflet-container{background:#0d1117;font-family:inherit}

/* plane markers */
.homepin{position:relative;width:30px;height:38px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.homepin svg{width:30px;height:38px;display:block}
.homepin span{position:absolute;top:8px;left:33px;font:800 13px system-ui,sans-serif;color:#13284a;white-space:nowrap;
  text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 0 4px #fff}
body:not(.lightmap) .homepin span{color:#fff;text-shadow:0 0 2px #000,0 0 3px #000}
.pl{position:relative;width:28px;height:28px}
.pl svg{width:28px;height:28px;color:var(--plane);--ol:#000;filter:none;transition:transform .6s}
/* outline drawn as a stroke behind the fill – far cheaper for the Hub to repaint while panning/zooming than stacked drop-shadow blurs */
.pl svg{overflow:visible}
.pl svg g>*{stroke:var(--ol);stroke-width:2.2px;stroke-linejoin:round;paint-order:stroke fill}
.pl svg g.sh>*{stroke:rgba(0,0,0,.45);stroke-width:4.4px}   /* soft dark edge under the outline, like the old shadow */
.pl span{position:absolute;top:27px;left:50%;transform:translateX(-50%);font:600 11px system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.65);padding:0 4px;border-radius:3px;white-space:nowrap}
.pl.on svg{color:var(--acc);transform-origin:center}
.dense .pl:not(.on):not(.emg) span{display:none}
.dense .pl svg g.sh{display:none}
.dense .pl svg{transition:none}
/* light (atlas / topo) maps: dark navy planes with a white outline, selected = orange with a dark outline */
.lightmap #map,.lightmap .leaflet-container{background:#dfe6ea}
.lightmap .pl svg{color:#13284a;--ol:#fff;filter:none}
/* categories: military = brown, trainer = yellow (the selected plane stays orange) */
.pl.mil:not(.on) svg{color:#6b3e14;--ol:#fff;filter:none}
.pl.mil:not(.on) span{background:#5a3310;color:#fff}
.pl.trn:not(.on) svg{color:#d9a300;--ol:#000;filter:none}
.pl.trn:not(.on) span{background:#d9a300;color:#000}
/* military trainer = light brown, airline = red, private = white */
.pl.mtr:not(.on) svg{color:#d2a46b;--ol:#000;filter:none}
.pl.mtr:not(.on) span{background:#d2a46b;color:#2b1a08}
.pl.pvt:not(.on) svg{color:#fff;--ol:#000;filter:none}
.pl.pvt:not(.on) span{background:#fff;color:#13284a;box-shadow:0 0 0 1px #13284a}
.pl.com:not(.on) svg{color:#d7191c;--ol:#fff;filter:none}
.pl.com:not(.on) span{background:#b01418;color:#fff}
/* emergency = flashing red/white, rescue = pink, police = light blue, ag = green, glider = turquoise, cargo = light grey */
@keyframes emg{0%,100%{color:#ff0000}50%{color:#fff}}
.pl.emg:not(.on) svg{animation:emg 1s steps(1) infinite;color:#ff0000;--ol:#000;filter:drop-shadow(0 0 4px #ff0000)}
.pl.emg span{background:#ff0000!important;color:#fff!important}
.pl.res:not(.on) svg{color:#ff4fa3;--ol:#fff;filter:none}
.pl.res:not(.on) span{background:#d6267e;color:#fff}
.pl.pol:not(.on) svg{color:#8ecbff;--ol:#000;filter:none}
.pl.pol:not(.on) span{background:#8ecbff;color:#0b2545}
.pl.ag:not(.on) svg{color:#0b5d1e;--ol:#fff;filter:none}
.pl.ag:not(.on) span{background:#0b5d1e;color:#fff}
/* Antarctic / research = glowing bright green */
.pl.ant:not(.on) svg{color:#39ff14;--ol:#000;filter:drop-shadow(0 0 8px #7dff5c)}
.pl.ant:not(.on) span{background:#39ff14;color:#000;box-shadow:0 0 6px #39ff14}
.pl.gld:not(.on) svg{color:#14c2b0;--ol:#000;filter:none}
.pl.gld:not(.on) span{background:#0f9488;color:#fff}
.pl.bal:not(.on) svg{color:#6c7bff;--ol:#fff;filter:drop-shadow(0 0 5px #6c7bff)}
.pl.bal:not(.on) span{background:#4455e0;color:#fff}
.pl.cgo:not(.on) svg{color:#c4c9cf;--ol:#000;filter:none}
.pl.cgo:not(.on) span{background:#c4c9cf;color:#13284a}
/* vintage / warbird = purple, business jet = bright yellow, drone = black */
.pl.vin:not(.on) svg{color:#a066ff;--ol:#fff;filter:none}
.pl.vin:not(.on) span{background:#7a3fe0;color:#fff}
.pl.biz:not(.on) svg{color:#ffff00;--ol:#000;filter:drop-shadow(0 0 5px #ffff66)}
.pl.biz:not(.on) span{background:#ffff00;color:#000}
.pl.drn:not(.on) svg{color:#111;--ol:#fff;filter:none}
.pl.drn:not(.on) span{background:#111;color:#fff}
/* airports */
.apt{position:relative;width:12px;height:12px}
.apt i{position:absolute;inset:0;border-radius:50%;background:#fff;border:3px solid #6a1b9a;box-shadow:0 0 0 1px rgba(255,255,255,.8)}
.apt.t1 i{border-width:4px}
.apt.mil i{border-color:#6b3e14}
.apt b{position:absolute;left:15px;top:-2px;font:700 11px system-ui,sans-serif;color:#4a1170;white-space:nowrap;
  text-shadow:0 0 2px #fff,0 0 2px #fff}
.apt.mil b{color:#5a3310}
.apt b small{font-weight:500;margin-left:4px}
body:not(.lightmap) .apt b{color:#e5d0ff;text-shadow:0 0 2px #000}
.lightmap .pl.on svg{color:#ff6a00;--ol:#000;filter:none}
.lightmap .pl span{background:rgba(19,40,74,.85)}
.lightmap .pl.on span{background:#ff6a00;color:#000}
.pl.on{width:36px;height:36px}
.pl.on svg{width:36px;height:36px}
.pl.on span{top:35px;background:var(--acc);color:#000}

/* side panel */
#side{flex:0 0 36%;background:var(--panel);border-radius:1.6vh;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.ph{position:relative;flex:0 0 43%;background:#05080c}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2a3a4d}
.noimg svg{width:13vh;height:13vh}
.badge{position:absolute;top:1vh;left:1vh;background:rgba(0,0,0,.7);padding:.4vh 1vh;border-radius:.8vh;font-size:2vh;font-weight:600}
.badge.actual{color:var(--good)}
.badge.generic{color:var(--plane)}
.credit{position:absolute;right:.8vh;bottom:.6vh;max-width:85%;font-size:1.7vh;background:rgba(0,0,0,.65);padding:.3vh .7vh;border-radius:.6vh;color:#cfd8e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.info{flex:1;padding:1.4vh 1.8vh;display:flex;flex-direction:column;gap:.6vh;min-height:0}
.top{display:flex;align-items:baseline;gap:1vh}
.cs{flex:none;max-width:60%;font-size:5.6vh;font-weight:800;letter-spacing:.03em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx{flex:1;min-width:0;font-size:2vh;line-height:1.5;color:var(--dim)}
.ty{font-size:2.6vh;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.rte{display:flex;align-items:baseline;gap:1vh;font-size:2.6vh;white-space:nowrap;overflow:hidden;min-height:3.4vh}
.rte b{font-size:3.2vh;font-weight:800;letter-spacing:.02em}
.rte .ar{color:var(--acc);font-weight:800}
.rte .ct{color:var(--dim);overflow:hidden;text-overflow:ellipsis;min-width:0}
.rte.none{color:var(--dim);font-size:2.2vh}
.rte .unk{color:var(--dim)}
.rte .ft{color:var(--dim);font-size:2.2vh;margin-left:.6vh;flex-shrink:0}
.hist{font-size:2.2vh;color:#ffd27a;flex-shrink:0}
.hist div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1vh;margin-top:auto}
.st{background:var(--deep);border-radius:1vh;padding:.9vh 1.2vh;min-width:0}
.st b{display:block;font-size:3.9vh;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.st b small{font-size:2.1vh;font-weight:500;color:var(--dim);margin-left:.4vh}
.st span{font-size:1.7vh;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.hd{display:inline-block;width:3.2vh;height:3.2vh;margin-right:.6vh;vertical-align:-0.4vh;color:var(--acc)}
/* plane list (default panel) */
#list{flex:1;display:flex;flex-direction:column;min-height:0}
.lh{flex:0 0 auto;padding:1.2vh 1.8vh;font-size:2vh;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #222d3a}
#rows{flex:1;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:1.4vh;width:100%;padding:1.2vh 1.8vh;border:0;border-bottom:1px solid #1d2632;
  background:none;color:var(--txt);text-align:left;font:inherit;cursor:pointer}
.row:active{background:#1c2633}
.grp{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;padding:.8vh 1.8vh;background:var(--deep);
  border-bottom:1px solid #1d2632;font-size:1.9vh;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.grp b{color:var(--txt)}
.grp{cursor:pointer}
.grp.shut{opacity:.6}
button.lh{display:block;width:100%;border:0;border-bottom:1px solid #222d3a;background:none;text-align:left;font-family:inherit;cursor:pointer}
.ovh{color:#ffd23f;font-weight:700}
.kpick{cursor:pointer;border-radius:.8vh}
.kpick.on{background:rgba(255,210,63,.18);box-shadow:inset 0 0 0 2px #ffd23f}
.rseg{display:flex;gap:.8vh;padding:1vh 1.8vh;border-bottom:1px solid #1d2632}
.rseg button{flex:1;padding:.8vh 0;border:0;border-radius:.8vh;background:#1c2633;color:var(--dim);font:700 1.9vh system-ui,sans-serif;cursor:pointer}
.rseg button.on{background:#ffd400;color:#000}
.vplay{flex:0 0 auto;width:5vh;height:5vh;border-radius:50%;background:#1c2633;color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:2.2vh}
.grp span{display:flex;align-items:center;gap:1.2vh}
.eye{border:0;background:none;color:var(--dim);padding:0 .4vh;margin:-.6vh 0;cursor:pointer;line-height:0}
.eye svg{width:3.2vh;height:3.2vh}
.eye.on{color:#ffd23f;filter:drop-shadow(0 0 3px #ffd23f)}
.eye.off{color:#ff6b6b}
.grp b,.grp>span{flex:1}
.grp>span{justify-content:flex-end}
.fold{flex:0 0 auto;border:0;border-radius:.8vh;background:#1c2633;color:var(--txt);padding:0 1.6vh;margin:-.6vh 1vh;cursor:pointer;line-height:0}
.fold svg{width:3.2vh;height:3.2vh;transition:transform .2s}
.grp.shut .fold svg{transform:rotate(-90deg)}
.row .ri{color:#7fb2ff;width:4vh;height:4vh;flex:0 0 auto}
.row .ri.mil{color:#b07a45}
.row .ri.trn{color:#d9a300}
.row .ri.mtr{color:#e6c08f}
.row .ri.com{color:#ff4b4e}
.row .ri.pvt{color:#fff}
.row .ri.emg{color:#ff0000;animation:emg 1s steps(1) infinite}
.row .ri.res{color:#ff6fb5}
.row .ri.pol{color:#8ecbff}
.row .ri.ag{color:#0b5d1e;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff)}
.row .ri.ant{color:#39ff14;filter:drop-shadow(0 0 3px #39ff14)}
.row .ri.gld{color:#2fd8c5}
.row .ri.bal{color:#8c98ff}
.row .ri.cgo{color:#c4c9cf}
.row .ri.vin{color:#b385ff}
.row .ri.biz{color:#ffff00}
.row .ri.drn{color:#111;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff)}
.tag{display:inline-block;margin-left:1vh;padding:.2vh .8vh;border-radius:.6vh;font-size:1.7vh;font-weight:700;vertical-align:.4vh;letter-spacing:.04em;text-transform:uppercase}
.tag.mil{background:#5a3310;color:#fff}
.tag.trn{background:#d9a300;color:#000}
.tag.mtr{background:#d2a46b;color:#2b1a08}
.tag.emg{background:#ff0000;color:#fff}
.tag.res{background:#d6267e;color:#fff}
.tag.pol{background:#8ecbff;color:#0b2545}
.tag.ag{background:#0b5d1e;color:#fff}
.tag.ant{background:#39ff14;color:#000;box-shadow:0 0 6px #39ff14}
.tag.gld{background:#0f9488;color:#fff}
.tag.bal{background:#4455e0;color:#fff}
.tag.cgo{background:#c4c9cf;color:#13284a}
.tag.vin{background:#7a3fe0;color:#fff}
.tag.biz{background:#ffff00;color:#000}
.tag.drn{background:#000;color:#fff;box-shadow:0 0 0 1px #fff}
.rc .tag{font-size:1.5vh}
.csn{font-size:2.2vh;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csn:empty{display:none}
.aps{font-size:2.4vh;color:#9fd8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:3vh}
.rt .apsl{color:#9fd8ff}
.rt .lap{color:#ffd27a;font-weight:700}
.row .ri svg{width:100%;height:100%}
.row .rm{flex:1;min-width:0}
.row .rc{display:block;font-size:3vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt{display:block;font-size:2vh;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rs{text-align:right;font-size:2.1vh;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.35}
.row .rs b{color:var(--txt);font-weight:600}

/* selected-plane panel */
#detail{flex:1;flex-direction:column;min-height:0}
#back{flex:0 0 auto;height:6vh;min-height:40px;padding:0 1.8vh;border:0;border-bottom:1px solid #222d3a;background:var(--deep);
  color:var(--acc);font:700 2.6vh system-ui,sans-serif;text-align:left;cursor:pointer}
#back:active{background:#1c2633}
.dnav{flex:0 0 auto;display:flex;background:var(--deep);border-bottom:1px solid #222d3a}
.dnav #back{flex:1;border-bottom:0}
.pn{flex:0 0 auto;width:8vh;min-height:40px;border:0;border-left:1px solid #222d3a;background:none;color:var(--acc);font:700 4.4vh/1 system-ui,sans-serif;cursor:pointer}
.pn:active{background:#1c2633}
.empty{display:none;flex:1;align-items:center;justify-content:center;text-align:center;padding:2vh;color:var(--dim);font-size:3vh}

/* right-hand map buttons: voice settings, rare plane list */
#mapbtns2{position:absolute;top:1.4vh;right:1.4vh;z-index:1000;display:flex;flex-direction:column;gap:1.2vh;align-items:flex-end}
.mbtn{display:flex;height:7vh;min-height:44px;padding:0 1.8vh;gap:1vh;align-items:center;font:700 2.6vh system-ui,sans-serif;
  line-height:1;white-space:nowrap;color:#fff;background:#13284a;border:0;border-radius:1.2vh;cursor:pointer;
  box-shadow:0 0 0 2px rgba(255,255,255,.5),0 .6vh 1.6vh rgba(0,0,0,.6)}
.mbtn:active{background:#24406b}
.mbtn svg{width:3.4vh;height:3.4vh}
.mbtn.off{background:#3a4552;color:#c9d2dc}
.mbtn b{min-width:3vh;padding:0 .8vh;border-radius:1vh;background:#ffd400;color:#000;font-size:2.2vh;line-height:3vh;text-align:center}
.mbtn b:empty{display:none}
.pop{position:absolute;top:1.4vh;right:1.4vh;bottom:1.4vh;z-index:1003;width:min(50vw,470px);display:flex;flex-direction:column;
  background:var(--panel);color:var(--txt);border-radius:1.4vh;box-shadow:0 0 0 2px rgba(255,255,255,.15),0 1vh 3vh rgba(0,0,0,.7);overflow:hidden}
.pop[hidden]{display:none}
.pop .kh{display:flex;align-items:center;justify-content:space-between;padding:1.2vh 1.8vh;font-weight:700;font-size:2.6vh;border-bottom:1px solid #1d2632}
.pop .kh button{border:0;background:#1d2632;color:#fff;font-size:2.6vh;width:5.6vh;height:5.6vh;border-radius:1vh;cursor:pointer}
.pop .pb{flex:1;overflow-y:auto;touch-action:pan-y}
.tg{display:flex;align-items:center;gap:1.6vh;width:100%;padding:1.1vh 1.8vh;border:0;border-bottom:1px solid #1d2632;background:none;
  color:var(--txt);font:inherit;text-align:left;cursor:pointer}
.tg span{flex:1}
.tg b{display:block;font-size:2.4vh}
.tg small{display:block;font-size:1.8vh;color:var(--dim)}
.tg i{flex:0 0 auto;width:7vh;height:3.8vh;border-radius:2vh;background:#3a4552;position:relative;transition:background .2s}
.tg i:after{content:"";position:absolute;top:.4vh;left:.4vh;width:3vh;height:3vh;border-radius:50%;background:#fff;transition:left .2s}
.tg.on i{background:var(--good)}
.tg.on i:after{left:3.6vh}
.tg.sub{padding-left:4vh}
.pop .note{padding:1.2vh 1.8vh;font-size:1.9vh;color:var(--dim)}
.pop .act{margin:1.2vh 1.8vh;padding:1.2vh 2vh;border:0;border-radius:1vh;background:var(--acc);color:#000;font:700 2.4vh system-ui,sans-serif;cursor:pointer}
.rr{display:flex;align-items:center;gap:1.4vh;width:100%;padding:1vh 1.8vh;border:0;border-bottom:1px solid #1d2632;background:none;
  color:var(--txt);font:inherit;text-align:left;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.rr .rm{flex:1;min-width:0}
.rr .rc{display:block;font-size:2.6vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .pal{margin-left:1vh;font-size:1.8vh;font-weight:600;color:#7fd4ff}
.tag.emg.tap{cursor:pointer;box-shadow:0 0 0 2px #fff}
#emgrows .er{padding:1vh 1.8vh;border-bottom:1px solid #1d2632;font-size:2vh}
#emgrows .er b{display:block;font-size:1.6vh;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
#emgrows .big{padding:1.4vh 1.8vh;font-size:2.6vh;font-weight:700;color:#ff6b6b}
.rr .rt{display:block;font-size:1.9vh;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr .rw{font-size:1.9vh;color:var(--dim);text-align:right;white-space:nowrap;line-height:1.35}
.rr .rw .now{color:var(--good);font-weight:700}
.rr .rw .gone{color:#ffb35c;font-weight:700}
.lastseen{position:relative}
.lastseen i{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:3px solid #ff6a00;box-shadow:0 0 0 2px #fff}
.lastseen span{position:absolute;left:18px;top:-12px;white-space:nowrap;background:#ff6a00;color:#fff;font:700 13px system-ui,sans-serif;padding:2px 6px;border-radius:4px}
.rr .star{color:#ffd400;font-size:3vh}
.rr .hsir{height:3.4vh;width:auto;border-radius:.6vh;flex:0 0 auto}
.pop .kh .khb{display:flex;gap:1vh}
.pop .kh .trash.on{background:#c62828}
.rr.sel{background:#2a1a1a}
.rr.sel .rc:before{content:"✕";display:inline-block;margin-right:1vh;width:3.2vh;height:3.2vh;line-height:3.2vh;text-align:center;border-radius:50%;background:#e53935;color:#fff;font-size:2.2vh}
.pop .kh .ktabs{display:flex;gap:.8vh}
.pop .kh .ktabs button{width:auto;height:auto;padding:.8vh 1.6vh;font:700 2.2vh system-ui,sans-serif;background:#1c2633;color:var(--dim)}
.pop .kh .ktabs button.on{background:#ffd400;color:#000}
.pop .kh .ktabs button[data-tab="emg"].on{background:#ff4040;color:#fff}
.ktabs b{margin-left:.6vh}
.rr .warn{color:#ff4040;font-size:3vh}
.en{padding:1vh 1.8vh;border-bottom:1px solid #1d2632;cursor:pointer}
.en .rc{display:block;font-size:2.2vh;font-weight:700;line-height:1.3}
.en .rt{display:block;font-size:1.8vh;color:var(--dim);margin-top:.3vh}
.en .ex{display:none;font-size:1.9vh;margin-top:.6vh;line-height:1.35}
.en.open .ex{display:block}
.en .ex a{color:#7fd4ff}
.rday{padding:1vh 1.8vh .6vh;font-size:1.9vh;font-weight:700;color:#ffd400;border-bottom:1px solid #1d2632}
/* pop-up card for the plane being announced */
#card{position:absolute;left:1.4vh;right:1.4vh;bottom:3vh;z-index:1002;display:flex;gap:1.6vh;align-items:center;
  max-width:min(92%,640px);margin:0 auto;padding:1.2vh;background:rgba(14,20,28,.94);color:var(--txt);border-radius:1.4vh;
  box-shadow:0 0 0 2px var(--acc),0 1vh 3vh rgba(0,0,0,.7);cursor:pointer;animation:cardin .35s ease-out}
#card[hidden]{display:none}
#card.rare{box-shadow:0 0 0 3px #ffd400,0 1vh 3vh rgba(0,0,0,.7)}
#card.emg{box-shadow:0 0 0 3px #ff0000,0 1vh 3vh rgba(0,0,0,.7)}
@keyframes cardin{from{transform:translateY(4vh);opacity:0}to{transform:none;opacity:1}}
#card .cph{flex:0 0 auto;width:22vh;height:14vh;border-radius:1vh;overflow:hidden;background:#05080c;display:flex;align-items:center;justify-content:center;color:#2a3a4d}
#card .cph img{width:100%;height:100%;object-fit:cover;display:block}
#card .cph svg{width:9vh;height:9vh}
#card .ctx{flex:1;min-width:0}
#card .ccs{font-size:3.4vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .ccs small{font-size:2vh;font-weight:700;color:#ffd400;margin-left:1vh;text-transform:uppercase;letter-spacing:.06em}
#card .csay{font-size:2.3vh;color:#cfd8e3;line-height:1.3}
/* announced plane pulses; rare planes wear a gold ring */
@keyframes pulse{0%{transform:scale(.6);opacity:.95}100%{transform:scale(2.4);opacity:0}}
.pl.flash:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px solid var(--acc);animation:pulse 1.2s ease-out infinite}
.pl.rare:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid #ffd400;box-shadow:0 0 6px #ffd400}
/* tap-to-hear button in the plane details */
#hear{flex:0 0 auto;align-self:center;width:6vh;height:6vh;border:0;border-radius:1vh;background:#1d2632;color:var(--acc);cursor:pointer;display:flex;align-items:center;justify-content:center}
#hear:active{background:#2a3646}
#hear svg{width:3.8vh;height:3.8vh}
/* "i" button 1 cm under the speaker: opens the full aircraft info page */
#info{position:relative}
#info .rte,#info .hist,#info .csn,#info .aps{padding-right:7vh}
#infobtn{position:absolute;right:1.8vh;top:calc(7.4vh + 1cm);z-index:2;width:6vh;height:6vh;border:0;border-radius:1vh;background:#1d2632;color:var(--acc);
  cursor:pointer;font:italic 700 4.2vh Georgia,"Times New Roman",serif;line-height:6vh;text-align:center;padding:0}
#infobtn:active{background:#2a3646}
#infopage{position:fixed;inset:0;z-index:1100;display:flex;flex-direction:column;background:var(--bg);color:var(--txt)}
#infopage[hidden]{display:none}
/* while the info page is up, stop drawing the map and list underneath so its scrolling stays smooth */
body.infoup main{visibility:hidden}
#infopage .ih{flex:0 0 auto;display:flex;align-items:center;gap:1.6vh;padding:1.2vh 1.8vh;border-bottom:1px solid #1d2632}
#infopage .ih b{font-size:4.4vh;font-weight:800;letter-spacing:.03em}
#infopage .ih span{flex:1;min-width:0;font-size:2.4vh;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#infopage .ih button{flex:0 0 auto;border:0;background:#1d2632;color:#fff;font-size:3vh;width:7vh;height:7vh;border-radius:1vh;cursor:pointer}
#infobody{flex:1;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:1.6vh 1.8vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:2vh;align-content:start;overscroll-behavior:contain;will-change:scroll-position}
#infobody .ipic{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:1vh;background:#05080c;display:block}
#infobody .wiki{font-size:2.3vh;line-height:1.45;color:#cfd8e3;margin-top:1.4vh}
#infobody .wiki small{display:block;color:var(--dim);font-size:1.8vh;margin-top:.6vh}
#infobody .use{font-size:2.3vh;line-height:1.45;color:#cfd8e3;margin-top:1.4vh;padding-top:1.2vh;border-top:1px solid #1d2632}
#infobody .use b{color:var(--acc)}
#infobody .use small{display:block;color:var(--dim);font-size:1.8vh;margin-top:.6vh}
#infobody .fleet{font-size:2.2vh;line-height:1.45;color:#cfd8e3;margin-top:1.4vh;padding-top:1.2vh;border-top:1px solid #1d2632}
#infobody .fleet>b{color:var(--acc);display:block}
#infobody .fleet i{display:block;font-style:normal;color:#fff;margin-top:.4vh}
#infobody .fleet ul{margin:.8vh 0 0;padding-left:2.2vh}
#infobody .fleet li{margin-bottom:.6vh}
#infobody .fleet li b{color:#fff}
#infobody .fleet small{display:block;color:var(--dim);font-size:1.8vh;margin-top:.6vh}
#infobody h3{font-size:2vh;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;margin:1.6vh 0 .6vh}
#infobody h3:first-child{margin-top:0}
#infobody table{width:100%;border-collapse:collapse;font-size:2.3vh}
#infobody td{padding:.5vh .8vh;border-bottom:1px solid #1d2632;vertical-align:top}
#infobody td:first-child{color:var(--dim);width:40%}
#infobody .links a{display:inline-block;margin:0 1vh 1vh 0;padding:.8vh 1.4vh;border-radius:1vh;background:#1d2632;color:#9fd8ff;text-decoration:none;font-size:2.2vh}
@media (max-aspect-ratio:1/1){#infobody{grid-template-columns:minmax(0,1fr)}}
/* space station */
.iss{position:relative;width:34px;height:34px;filter:drop-shadow(0 0 2px #000)}
.iss svg{width:34px;height:34px}
.iss span{position:absolute;top:33px;left:50%;transform:translateX(-50%);font:700 11px system-ui,sans-serif;color:#000;background:#fff;padding:0 4px;border-radius:3px;white-space:nowrap}
#issbadge{position:absolute;left:1.4vh;bottom:1.4vh;z-index:1000;padding:.8vh 1.4vh;border-radius:1vh;background:rgba(19,40,74,.92);color:#fff;
  font:700 2.2vh system-ui,sans-serif;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
#issbadge[hidden]{display:none}
#onlytag{position:absolute;left:50%;bottom:1.4vh;transform:translateX(-50%);z-index:1001;padding:.8vh 1.6vh;border:0;border-radius:1vh;
  background:#ffd23f;color:#000;font:700 2.2vh system-ui,sans-serif;box-shadow:0 .3vh 1vh rgba(0,0,0,.4);cursor:pointer;white-space:nowrap}
#voicehint{position:absolute;left:50%;top:10vh;transform:translateX(-50%);z-index:1003;padding:1vh 2vh;border-radius:1vh;background:var(--acc);color:#000;font:700 2.4vh system-ui,sans-serif}
#voicehint[hidden]{display:none}
</style>
</head>
<body>
<header>
  <span class="t">✈ Planes near <span id="place">Marton</span></span>
  <span class="c" id="count">Loading…</span>
  <span class="sp"></span>
  <span id="status"></span>
  <span id="clock"></span>
</header>

<main>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="mapbtns">
      <button id="home" type="button"><span class="ic">⌂</span><span>Return to <span id="homeName">Marton</span></span></button>
      <button id="keybtn" type="button"><span class="dots"><i></i><i></i><i></i></span><span>Colour key</span></button>
      <button id="sirenbtn" type="button" aria-label="Police Eagle hunts" hidden><img alt="" src="police-siren.gif"><b id="huntcount"></b></button>
    </div>
    <div id="zoombtns">
      <button id="zoom2" class="mbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6M7 10h6"/></svg><span></span></button>
      <button id="zoomni" class="mbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6M7 10h6"/></svg><span></span></button>
      <button id="zoomnz" class="mbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6M7 10h6"/></svg><span></span></button>
      <button id="zoomcont" class="mbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span>Continents</span><b id="contcount"></b></button>
    </div>
    <div id="stepbtns">
      <button id="stepin" class="mbtn" type="button" aria-label="Zoom in 25 km">+</button>
      <button id="stepout" class="mbtn" type="button" aria-label="Zoom out 25 km">−</button>
    </div>
    <button id="hourbtn" class="mbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Hourly update</span></button>
    <div id="mapbtns2">
      <button id="voicebtn" class="mbtn" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg><span>Voice</span></button>
      <button id="rarebtn" class="mbtn" type="button"><svg viewBox="0 0 24 24" fill="#ffd400"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg><span>Rare planes</span><b id="rarecount"></b></button>
    </div>
    <div id="voicepanel" class="pop" hidden>
      <div class="kh"><span>Voice announcements</span><button class="popclose" type="button" aria-label="Close">✕</button></div>
      <div class="pb" id="voicerows"></div>
    </div>
    <div id="huntpanel" class="pop" hidden>
      <div class="kh"><span>Police Eagle hunts</span><button class="popclose" type="button" aria-label="Close">✕</button></div>
      <div class="pb" id="huntrows"></div>
    </div>
    <div id="emgpanel" class="pop" hidden>
      <div class="kh"><span id="emgtitle">Emergency</span><button class="popclose" type="button" aria-label="Close">✕</button></div>
      <div class="pb" id="emgrows"></div>
    </div>
    <div id="rarepanel" class="pop" hidden>
      <div class="kh"><span class="ktabs"><button type="button" data-tab="rare">Rare planes</button><button type="button" data-tab="emg">Emergencies<b id="emgcount"></b></button></span><span class="khb"><button class="trash" type="button" aria-label="Delete selected planes">🗑</button><button class="popclose" type="button" aria-label="Close">✕</button></span></div>
      <div class="pb" id="rarerows"></div>
    </div>
    <div id="contpanel" class="pop" hidden>
      <div class="kh"><span id="conttitle">Rare plane scan</span><span class="khb"><button class="trash" type="button" aria-label="Delete selected planes">🗑</button><button class="popclose" type="button" aria-label="Close">✕</button></span></div>
      <div class="pb" id="controws"></div>
    </div>
    <div id="card" hidden><div class="cph" id="cardph"></div><div class="ctx"><div class="ccs" id="cardcs"></div><div class="csay" id="cardsay"></div></div></div>
    <div id="issbadge" hidden></div>
    <button id="onlytag" type="button" hidden></button>
    <div id="voicehint" hidden>Tap the screen once to turn the voice on</div>
    <div id="key" hidden>
      <div class="kh"><span>Colour key</span><button id="keyclose" type="button" aria-label="Close">✕</button></div>
      <div id="keyrows"></div>
    </div>
  </div>
  <section id="side">
    <div id="list">
      <button class="lh" id="sortbtn" type="button">Nearest first · tap to sort</button>
      <div id="rows"></div>
    </div>
    <div id="detail" style="display:none">
    <div class="dnav"><button id="back" type="button">← All planes</button><button id="prevp" class="pn" type="button" aria-label="Previous plane">‹</button><button id="nextp" class="pn" type="button" aria-label="Next plane">›</button></div>
    <div class="ph" id="ph">
      <div class="noimg" id="noimg"></div>
      <img id="img" alt="" referrerpolicy="no-referrer" style="display:none">
      <div class="badge" id="badge" style="display:none"></div>
      <div class="credit" id="credit" style="display:none"></div>
    </div>
    <div class="info" id="info">
      <div class="top"><div class="cs" id="cs">—</div><div class="idx" id="idx"></div><button id="hear" type="button" aria-label="Read out"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button></div>
      <button id="infobtn" type="button" aria-label="All about this aircraft">i</button>
      <div class="ty" id="ty">&nbsp;</div>
      <div class="ty" id="spec"></div>
      <div class="rte" id="rte"></div>
      <div class="hist" id="hist"></div>
      <div class="csn" id="csn"></div>
      <div class="aps" id="aps"></div>
      <div class="stats">
        <div class="st"><span>Altitude</span><b id="sAlt">—</b></div>
        <div class="st"><span>From <span id="distName">Marton</span></span><b id="sDist">—</b></div>
        <div class="st"><span>Heading</span><b id="sHdg">—</b></div>
        <div class="st"><span>Speed</span><b id="sSpd">—</b></div>
      </div>
    </div>
    </div>
    <div class="empty" id="empty"></div>
  </section>
</main>
<div id="infopage" hidden>
  <div class="ih"><b id="infocs"></b><span id="infosub"></span><button id="infoclose" type="button" aria-label="Close">✕</button></div>
  <div id="infobody"><div id="infoleft"></div><div id="inforight"></div></div>
</div>

<script>
(function () {
  "use strict";

  // ---------- settings ----------
  var P = new URLSearchParams(location.search);
  function num(k, d) { var v = parseFloat(P.get(k)); return isNaN(v) ? d : v; }
  var LAT = num("lat", -40.07);
  var LON = num("lon", 175.38);
  var RADIUS_NM = Math.min(num("r", 60), 250);
  var ZOOM = num("zoom", 0);
  var HOME_EDGE_KM = num("edge", 25);   // home view: zoomed so this distance reaches the map edge (Sanson is ≈ 17 km)
  var PLACE = P.get("name") || "Marton";
  var TZ = P.get("tz") || "Pacific/Auckland";
  var MAP_STYLE = (P.get("map") || "natgeo").toLowerCase();
  if (MAP_STYLE !== "dark") document.body.classList.add("lightmap");
  var FOLLOW_MS = 2000;    // poll interval while following a plane
  var REFRESH_MS = 6000;   // adsb.lol poll interval (be kind to the free API)
  var PREFETCH_N = 8;      // pre-load photos for this many nearest planes so taps feel instant
  // Data comes via the relay in api/feed.js (adsb.lol / adsb.fi don't allow direct browser access)
  var FEED = P.get("feed") || "/api/feed";
  // Plane feeds often refuse Cloudflare's addresses, so when /api/feed fails try the Deno relay (if set)
  var RELAY2 = P.get("feed") ? "" : (P.get("relay") || "https://planes.daryljohncox.deno.net/api/feed");
  var relayIdx = 0, cfRetryAt = 0;   // relay that last worked; Cloudflare is retried once a minute after it fails
  function feedFetch(qs, opts) {
    var urls = (RELAY2 ? [FEED, RELAY2] : [FEED]);
    var order = urls.map(function (u, k) { return k; });
    if (relayIdx && Date.now() < cfRetryAt) order.reverse();   // Cloudflare is blocked right now: go straight to Deno
    var n = 0;
    function next() {
      var k = order[n++], last = n >= order.length;

  }
  // Passes over home in the next 12 hours that climb at least 10° above the horizon
  function findPasses() {
    if (!issRec) return;
    var out = [], cur = null, t0 = Date.now();
    for (var s = 0; s < 12 * 3600; s += 20) {
      var p = issAt(new Date(t0 + s * 1000));
      if (!p) continue;
      if (p.el > 0) {
        if (!cur) cur = { start: t0 + s * 1000, az: p.az, max: p.el, maxAz: p.az };
        if (p.el > cur.max) { cur.max = p.el; cur.maxAz = p.az; }
        cur.end = t0 + s * 1000;
      } else if (cur) { if (cur.max >= 10) out.push(cur); cur = null; }
    }
    issPasses = out;
  }
  function issTick() {
    if (!issRec || !map) return;
    var now = new Date(), p = issAt(now);
    if (!p) return;
    if (!issMarker) {
      issMarker = L.marker([p.lat, p.lon], { interactive: false, keyboard: false, zIndexOffset: 2000,
        icon: L.divIcon({ className: "", iconSize: [34, 34], iconAnchor: [17, 17], html: '<div class="iss">' + ISS_ICON + "<span>Space station</span></div>" }) });
      issTrack = L.polyline([], { color: "#2f6fd6", weight: 2, opacity: 0.8, dashArray: "6 6", interactive: false });
    }
    var inView = map.getBounds().pad(0.5).contains([p.lat, p.lon]);
    if (inView) {
      issMarker.setLatLng([p.lat, p.lon]).addTo(map);
      var line = [];
      for (var m = -8; m <= 8; m++) { var q = issAt(new Date(now.getTime() + m * 60000)); if (q) line.push([q.lat, q.lon]); }
      issTrack.setLatLngs(line).addTo(map);
    } else { map.removeLayer(issMarker); map.removeLayer(issTrack); }
    // Badge while it's above the horizon here
    $("issbadge").hidden = p.el <= 0;
    if (p.el > 0) $("issbadge").textContent = "Space station overhead · look " + dir8(p.az) + " · " + Math.round(p.el) + "° up";
    // Announce 5 minutes before it rises
    issPasses.forEach(function (ps) {
      var lead = ps.start - now.getTime();
      if (lead > 0 && lead <= 5 * 60000 && issSaid !== ps.start) {
        issSaid = ps.start; store.set("issSaid", ps.start);
        if (VOICE.on && VOICE.iss) {
          var mins = Math.max(1, Math.round(lead / 60000));
          say({ chime: "space", card: { title: "Space station", tag: "Coming over", icon: ISS_ICON },
            text: "The International Space Station will pass over " + PLACE + " in " + (mins === 1 ? "about a minute" : mins + " minutes") +
              ". Look " + dir8(ps.az) + ". It will climb to " + Math.round(ps.max) + " degrees, highest in the " + dir8(ps.maxAz) + "." });
        }
      }
    });
  }

  drawVoicePanel();
  rareCount();

  // ---------- clock / timers ----------
  function tick() {
    try {
      $("clock").textContent = new Date().toLocaleTimeString("en-NZ", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    if (lastOk && Date.now() - lastOk > 60000) setStatus("Data is stale – retrying");
  }

  $("place").textContent = PLACE;
  $("homeName").textContent = PLACE;
  $("distName").textContent = PLACE;
  poll();
  setInterval(function () { if (!(selHex && selLast)) poll(); }, REFRESH_MS);
  // The plane you're following: fresh fix every 3 s, and in between it keeps gliding along its heading
  setInterval(function () { if (selHex && selLast) poll(); }, FOLLOW_MS);
  setInterval(function () {
    var a = selHex && selLast, f = selFix;
    if (!a || !f || a.alt === "ground" || !(a.gs > 5) || a.track == null) return;
    var dt = Math.min(15, (Date.now() - f.at) / 1000), d = a.gs * 0.514444 * dt / 6371000, br = a.track * Math.PI / 180,
        la = f.lat * Math.PI / 180, lo = f.lon * Math.PI / 180,
        la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(br)),
        lo2 = lo + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2)),
        p = { lat: la2 * 180 / Math.PI, lon: lo2 * 180 / Math.PI };
    if (markers[a.hex]) markers[a.hex].setLatLng([p.lat, p.lon]);
    if (mapFollow) mapFollow({ lat: p.lat, lon: p.lon }, true);
    // numbers keep ticking too: altitude climbs or sinks at the reported rate, distance follows the new position
    var live = Object.assign({}, a, { lat: p.lat, lon: p.lon, homeDist: distKm(LAT, LON, p.lat, p.lon), homeBrg: bearing(LAT, LON, p.lat, p.lon) });
    if (typeof a.alt === "number" && a.vr) live.alt = Math.max(0, Math.round(a.alt + a.vr * dt / 60));
    $("sAlt").innerHTML = altHtml(live);
    $("sDist").innerHTML = live.homeDist.toFixed(1) + "<small>km " + compass(live.homeBrg) + "</small>";
  }, 500);
  tick();
  setInterval(tick, 1000);
  setInterval(hourly, 15000);
  setInterval(nextSay, 2000);
  loadIss();
  setInterval(issTick, 5000);
  setInterval(findPasses, 10 * 60000);
  setTimeout(chcCheck, 3000);
  setInterval(chcCheck, CHC_MS);
  setTimeout(southCheck, 5000);
  setTimeout(eagleCheck, 7000);
  setInterval(eagleCheck, EAGLE_MS);
  setInterval(southCheck, SOUTH_MS);
  setTimeout(resumeIce, 2000);
  setTimeout(milCheck, 9000);
  setTimeout(emgWatch, 5000);
  setTimeout(incidentCheck, 12000);
  setInterval(incidentCheck, INCIDENTS_MS);
  setInterval(emgWatch, EMG_WATCH_MS);
  setInterval(milCheck, MIL_MS);
  setTimeout(iceWatch, 15000);
  setInterval(iceWatch, ICE_WATCH_MS);
  // Reload hourly to keep the Nest Hub's browser fresh over long sessions
  setTimeout(function () { saveTrails(); location.reload(); }, 3600000);
})();
</script>
</body>
